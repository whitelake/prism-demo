# levels.yaml
#
# 等级定义。注入到评估 Prompt（config/prompts/evaluation.md）用于等级判定。
# 维度定义见 dimensions.yaml，本文件只引用维度代号（D1–D4）。
# 判定流程与 pending 机制详见 docs/prd.md 第5章。
# 由产品团队维护。修改后调用 POST /api/v1/admin/reload-config 生效。
#
# 版本：v0.4
# 变更：维度由 6 个合并为 4 个（原 D4流程改造/D5影响力/D6组织推动 → D4 沉淀与外溢）；
#       L2 更名「进阶」；其余规则同 v0.3。


meta:
  version: "0.4"
  level_order: [L0, L1, L2, L3, L4]
  pending_levels: [L4_pending]
  pending_equals_base: true      # 一致性对比时 L4_pending 视为等于 L4
  dimension_count: 4             # 输出的 dimensions 数组必须恰好 4 项
  dimensions: [D1, D2, D3, D4]


# ============================================================
# 零、设计前提（评估模型必须先读这一段）
# ============================================================
design_premise: |
  本测评由三部分材料构成：问卷（自报）、考官模式对话（自述）、
  两个实操任务（T1 生成类、T2 核查类）。

  这套材料的验证能力是有边界的：
  · T1 能直接观察任务拆解与信息组织的真实水平；
  · T2 能直接观察对 AI 输出的核验意识；
  · 但"方法被他人采纳""改造了协作流程""建立了团队规范"这类事实，
    没有任何实操任务能够印证，只能依赖候选人自述。

  因此本体系做出如下取舍：
  L0–L3 是测评可以独立给出结论的区间；
  L4 是测评只能提出假设、必须由现场追问确认的区间。

  评估模型在判定时应当承认这个边界：
  不要因为候选人表达流畅、叙述宏大、职位较高，就在缺少现场验证的情况下
  给出确定的高等级。宁可判 L3 或 L4_pending，也不要越过边界。


# ============================================================
# 一、证据等级
# ============================================================
evidence_grades:

  - grade: E0
    name: 无证据
    definition: 该维度在全部材料中无任何可归因的表述或行为。
    maps_to: dimension.insufficient_evidence = true

  - grade: E1
    name: 泛泛自述
    definition: |
      有表述但无法核查。缺少可追问的下一层细节——没有时间、没有对象、
      没有数字、没有具体任务名称，或使用"经常""挺多的""效率提升很大"
      这类不可验证的表达。
    example: "我平时用 AI 提效挺多的，写东西、查资料都用。"
    ceiling: 单靠 E1 证据最高只能支撑 L1。

  - grade: E2
    name: 具体自述
    definition: |
      有可核查的具体细节：能说出时间、具体任务、具体对象、具体做法或具体数字，
      描述内部自洽，且能承受一层追问。但来源仅为候选人自己的描述，
      未在实操任务或现场追问中得到印证。
    example: "上周三整理三个区域的销售表，字段名不一致，我让它先统一字段再合并。"

  - grade: E3
    name: 已印证
    definition: |
      在 E2 基础上获得独立来源的印证。两种来源之一：
      · source = task：实操任务（T1/T2）中出现了与自述一致的行为表现；
      · source = interview：面试文字记录中，候选人针对追问给出了更深一层的
        具体细节，且与前序自述无矛盾。
    note: |
      source = interview 的 E3 只可能出现在终判（评估C）。
      评估A 阶段的 E3 只能来自 task。

evidence_reachability:
  description: |
    各维度在评估A 阶段能达到的最高证据等级。这是 L4 恒为 pending 的根本原因。
  D1: E3     # 使用强度与场景广度 —— 可由 T1/T2 的实际投入侧面印证
  D2: E3     # 任务拆解与信息组织 —— 由 T1 直接印证
  D3: E3     # 核验意识 —— 由 T2 直接印证
  D4: E2     # 沉淀与外溢 —— 无任何对应实操任务，只能自述


# ============================================================
# 二、等级定义
# ============================================================
levels:

  # ----------------------------------------------------------
  - level: L0
    name: 未达入门
    one_line: 基本不使用 AI，或全程举不出任何一次具体使用经历。
    definition: |
      不具备可评估的 AI 使用行为。表现为以下任一：
      （1）对话中无法定位到任何一次具体的 AI 使用场景；
      （2）两个实操任务均无有效输入（未提交，或输入与任务完全无关）；
      （3）全部维度证据等级均不超过 E1，无任何一条 E2。
    core_discriminator: |
      与 L1 的唯一区别：L1 至少能说出一次"什么时候、用它做了什么具体的事"；
      L0 说不出。
    required_evidence: []        # 兜底级，不需要正向证据
    track: 无
    boundary_with_next: |
      只要 D1 出现一条 E2 证据，即判 L1，不得判 L0。
      使用频率低不是 L0 的判据——一周用几次但能说清具体做了什么，是 L1。
    common_misclassification: |
      × 因为"用得少"判 L0。判据是"举不出具体案例"，不是频率。
      × 因为表达能力弱、描述简短就判 L0。看内容是否可定位，不看流畅度。

  # ----------------------------------------------------------
  - level: L1
    name: 入门
    one_line: 把 AI 当搜索引擎或文本生成器——单轮、单句、拿来即用。
    definition: |
      已在真实工作中使用 AI，但停留在"提问—取答"的单轮交易模式：
      提示词是一句话式的简单指令，不提供背景、角色、约束或输出格式要求；
      对返回结果的处理是"能用就用，不能用就换个说法再问一次或放弃"，
      没有主动的核验动作，也没有把有效用法留下来的意识。
      使用范围局限于自己的单点任务。
    core_discriminator: 信息输入是单要素的，结果处理是被动接受的。
    required_evidence:
      - dimension: D1
        requirement: 能说出至少一次具体的 AI 使用经历（有时间、有具体任务）。
        min_grade: E2
    track: 无
    typical_signals:
      - "T1 首轮提示词为单句指令（如'帮我写一封催货邮件'），不含延期时长、对方身份、诉求或语气要求。"
      - "问'结果你怎么处理的'，答'看着差不多就直接用了'或'不行就让它再写一遍'。"
      - "问'有没有发现过它说错'，答'没注意过'或'应该没有'。"
      - "T2 中直接把材料丢给 AI 问'这个能用吗'，接受回答后不再追问。"
      - "说不出任何一个自己反复使用的固定问法。"
    boundary_with_next: |
      分界线是【是否有主动的信息补充与有效迭代】：
      · T1 中出现"首轮不满意 → 第二轮补充了新的约束或背景信息" → 进入 L2 候选；
      · 若多轮追加只是换措辞重复同一诉求（"再写一遍""写好一点"），
        不构成迭代，仍判 L1。
    common_misclassification: |
      × 使用频率高（每天多次）就判 L2 以上。高频单轮问答仍是 L1。
      × 提示词字数长就判 L2。长度不等于要素完整，要看有没有背景/约束/格式要求。

  # ----------------------------------------------------------
  - level: L2
    name: 进阶
    one_line: 会喂背景、会多轮修正，但核验靠"读起来对不对"，且用法不沉淀。
    definition: |
      已理解"信息给得越完整，结果越可用"，能在提示词中主动提供背景、
      对象、诉求或输出格式，并在结果不满意时通过补充新信息进行有效迭代。
      但存在两个明确的上限：
      （1）核验停留在直觉层——判断标准是"读起来通不通顺、像不像对的"，
          不做外部交叉核对，对数字、事实、引用来源缺少警觉；
      （2）用法不沉淀——每次从零重新组织提示词，没有可复用的模板、
          固定提示词或工作流，也说不清自己的有效做法是什么。
      使用范围仍限于个人任务。
    core_discriminator: |
      输入已是多要素、可迭代，但结果处理仍是直觉验收，且没有稳定的复用资产。
    required_evidence:
      - dimension: D2
        requirement: |
          提示词包含两类及以上有效要素（背景 / 对象 / 约束 / 诉求 / 格式 / 示例），
          或出现过一次有效迭代（补充新信息，而非重复措辞）。
        min_grade: E2
        preferred_source: T1
    track: 无
    typical_signals:
      - "T1 首轮提示词包含延期情况，并提出'不要破坏合作关系'这类约束。"
      - "T1 第二轮补充'语气再客气一点，但要明确要一个具体日期'。"
      - "问核验方式，答'我会通读一遍看有没有明显不对的地方'。"
      - "T2 中让 AI 判断材料是否可用，但不去查原始来源，也不质疑 AI 的判断依据。"
      - "问'有没有把好用的问法存下来'，答'没有，每次都重新打'。"
    boundary_with_next: |
      分界线是【三个硬门槛，必须同时满足才能进 L3】：
      ① 任务拆解（D2）：能把复杂任务拆成步骤或分阶段交给 AI，
         或能明确说出"哪一部分我不交给 AI，因为……"；
      ② 主动核验（D3）：有可描述的核验动作（查原始来源、交叉比对、自己复算），
         且能举出至少一次"发现 AI 出错并纠正"的具体案例；
      ③ 个人沉淀（D4 的 L3 档）：有反复使用的提示词/模板/清单/工作流，
         能说出它的形态与至少一次迭代内容。
      缺任意一条即封在 L2。
    common_misclassification: |
      × 提示词写得漂亮就判 L3。提示词质量只覆盖门槛①的一半。
      × 候选人说"我一定会核对"但举不出案例 → 该条为 E1，门槛②不满足，判 L2。
      × 候选人说"我有一套自己的方法"但说不出形态 → 门槛③不满足，判 L2。

  # ----------------------------------------------------------
  - level: L3
    name: 熟练
    one_line: 会拆任务、会主动核验、有自己反复使用的方法资产——但影响仅限于自己。
    definition: |
      具备可信的个人层面 AI 应用能力，三个特征同时成立：
      （1）任务拆解：面对复杂任务能分解处理，对"哪些环节适合交给 AI、
          哪些必须自己判断"有清晰且能给出理由的边界意识；
      （2）主动核验：把 AI 输出视为待验证的草稿而非结论，对数字、事实、
          引用有稳定的核对习惯，并能举出至少一次因核验而发现错误的具体经历；
      （3）个人资产化：把有效用法沉淀成可重复使用的形态（固定提示词、模板、
          检查清单、固定工作流），能说明其结构与迭代过程。
      产出与改进的受益范围主要是自己。
    core_discriminator: |
      L3 是"个人可信"的分界线，也是本测评能够独立确认的最高等级。
      三个门槛全部具备，但改造效果没有扩散到他人或流程。
    required_evidence:
      - dimension: D2
        requirement: |
          存在任务拆解行为（分步骤/分角色/分阶段），
          或能说出明确的"不交给 AI 的部分 + 理由"。
        min_grade: E2
      - dimension: D3
        requirement: |
          能描述具体的核验动作（不是"我会检查"，而是"我会去核对原表里的数字"
          这类可执行动作），且能举出至少一次发现 AI 出错的具体案例。
        min_grade: E2
      - dimension: D4
        requirement: |
          达到 D4 的 L3 档：存在个人层面的稳定复用物，能说出其形态
          （模板/提示词/清单/流程）与至少一次迭代内容（第二版加了什么、为什么加）。
        min_grade: E2
    additional_gate:
      description: D2 与 D3 中至少一项达到 E3（source = task）。
      rationale: |
        L3 是本测评最关键的分界线，不能仅凭自述认定。
        T1 印证 D2，T2 印证 D3——两个实操任务的存在就是为了给 L3 提供硬证据。
      if_not_met: |
        自述充分（D2/D3/D4 均 E2）但实操表现与自述明显不符时，
        不判 L4_pending 也不判 L3，而是按 level_caps.LC1 处理：
        判 L2 并记录落差。理由：实操已给出反向证据，这不是"证据不足待验证"，
        而是"已有证据指向更低水平"。
    track: 无
    typical_signals:
      - "T1 中先让 AI 列出邮件结构框架，确认后再让它填充内容。"
      - "T2 中主动质疑'这个增速的统计口径是什么'，或要求 AI 说明信息来源。"
      - "T2 中识别出材料缺少数据来源，并说明'这种数字我不会直接写进方案'。"
      - "能说出'我有个固定模板，里面必须写清受众、目的、字数、禁忌'。"
      - "能举出具体纠错案例：'它把去年的数据说成今年的，我对了原表才发现。'"
    boundary_with_next: |
      分界线是【产出是否扩散到自己之外，且扩散事实可核查】，即 D4 是否达到 L4 档：
      · 自己的方法/模板被他人实际采纳并在持续使用（不是"给同事看过"）；
      · 或改造了涉及两人及以上协作的流程环节，改造后的做法成为实际执行方式；
      · 或建立了团队层面的规范、检查流程、培训机制。
      需有可核查的扩散事实：谁在用、用在什么场景、用了多久，或改造前后的具体差别。
      只有"我教过同事怎么用"而对方并未持续使用 → 仍判 L3。
    common_misclassification: |
      × 用得很深、很专业但完全没有外溢 → 就是 L3，不要因为"感觉很强"给 L4_pending。
      × 候选人是管理者、说"我要求团队都用 AI" → 这是职权要求，不是扩散事实。
        需追问是否真的形成了被采纳的方法或规范，否则仍判 L3 或更低。

  # ----------------------------------------------------------
  - level: L4
    name: 专家（需现场验证）
    one_line: 能力已外溢——方法被他人真实采纳、流程被改造，或形成了团队机制。
    definition: |
      在满足 L3 全部要求的基础上，AI 应用的产出已超出个人边界，
      即 D4 达到 L4 档（三种外溢形式任一成立，不要求全部具备）：
      （1）他人采纳：自己形成的方法、提示词、模板或工作流被他人实际采纳，
          且对方在持续使用；
      （2）流程改造：改造了涉及两人及以上协作的工作环节，
          改造后的做法成为该环节的实际执行方式；
      （3）组织机制：建立了规范、标准、检查流程或培训，使他人
          即使不经自己指导也能按该机制工作。
      并能说明改造带来的具体变化（时间、返工率、口径一致性等），
      变化描述具体到可追问下一层，而非"效率提升很多"。
    core_discriminator: |
      L4 的判据是【他人的行为因此发生了改变，且改变可核查】。
      不是"我分享了"，而是"别人在用"。
    required_evidence:
      - inherit: L3            # L3 三个门槛必须全部满足，无例外
      - dimension: D4
        requirement: 达到 D4 的 L4 档（三种外溢形式任一，含可核查细节）。
        min_grade: E2
        note: |
          D4 在评估A 阶段最高只能达到 E2（见 evidence_reachability），
          这是本等级恒为 pending 的直接原因。

    # ★ 本等级最重要的规则
    pending_rule:
      mandatory: true
      output_level: L4_pending
      applies_to: 评估A（首次评估）
      rule: |
        评估A 阶段判定为 L4 时，输出等级恒为 L4_pending，不存在直接输出 L4 的情况。
      why: |
        D4 没有对应的实操任务，L4 的关键证据永远只有候选人自述这一个来源。
        单一来源的自述不足以支撑本测评的最高等级，必须由现场追问补充第二来源。
      resolution: |
        由终判（评估C）处理，三种结果：
        · 面试记录中候选人给出了更深一层的具体细节，与自述一致 → 确认 L4；
        · 追问后无法给出可核查细节，或叙述停留在同一抽象层 → 降至 L3；
        · 追问暴露出与自述矛盾，或 L3 门槛实际不成立 → 降至 L2。
      constraint_for_evaluator: |
        评估A 的输出中，level 字段只允许 L0 / L1 / L2 / L3 / L4_pending。
        出现 L4 视为违规输出，需重新生成。

    tracks:
      note: 轨道仅在 L4 判定，L0–L3 一律输出"无"。
      个人深度轨道: |
        通过专业深度产生外溢——因为方法本身好用，他人主动来学、来要、来用。
        典型证据：有人主动索取提示词或模板；做法被同事复制进自己的工作；
        被邀请制定规范或做内部培训（且之后有人真的在用）。
        判定要点：外溢来自方法的说服力，不来自职位权力。
      团队负责人轨道: |
        通过管理职责产生外溢——组织团队采用某种 AI 做法并落地。
        典型证据：为团队定义了统一做法并推动执行；团队成员实际工作方式改变了。
        判定要点：必须同时满足 L3 的个人门槛。
                 只有推动动作、个人应用深度停在 L1/L2 的，不判 L4_pending，
                 判 L2 或 L3，并在 overall.reasoning 中明确写出
                 "有组织推动动作，但个人应用深度不足"。
      无法判断: |
        证据不足以区分外溢来自专业说服力还是职权时输出。
        须在 key_uncertainties 中说明，并作为现场追问方向。

    typical_signals:
      - "'我做的那个数据核对清单，现在组里另外两个人也在用，大概用了三个月。'"
      - "'原来三个人各自整理再汇总，格式老是不统一；我定了一套字段规范和提示词，现在都按这个来。'"
      - "'别的组同事主动来找我要过那套提示词。'"
      - "'我们定了一条规则：AI 生成的对外文案必须有第二个人核过数字才能发。'"

    interview_focus:
      description: |
        L4_pending 的现场追问方向。生成追问题纲时优先覆盖，
        但题纲文本中不得出现等级、维度名或任何评价性词汇。
      priorities:
        - 让候选人描述被采纳物的具体形态与结构（有哪些字段、包含哪几步）。
        - 让候选人说明采纳者是谁、在什么场景用、用了多久、现在还在不在用。
        - 让候选人说明至少一次迭代：第二版改了什么、为什么改。
        - 若涉及流程改造或机制：追问推动过程中遇到的阻力与应对方式。
          没有阻力叙述的"推动"通常不是真实发生过的推动。
        - 若为团队负责人轨道：分辨是他推动形成的做法，还是公司/上级统一要求的。

    boundary_above: |
      L4 是最高级。认定应当保守：
      本测评的材料结构不足以区分"能力很强的实践者"与"组织级专家"，也不试图区分。
      凡外溢事实成立且 L3 门槛齐备，即为 L4，不再向上细分。

    common_misclassification: |
      × "我在周会上分享过 AI 用法" → 分享不等于采纳，需确认有人真的在用。
      × "我们团队现在都用 AI 了" → 需区分是他推动的，还是公司统一要求的。
      × 有制度文档但说不出落地程度与阻力 → 仍是 L4_pending，交由现场验证，
        不要在评估A 阶段自行降级或升级。
      × 能大段谈 AI 趋势与方法论但个人实操停在 L2 → 按
        level_caps.LC1 处理，判 L2 并标注重大落差。


# ============================================================
# 三、判定顺序（评估 Prompt 必须按此顺序执行，不得跳步）
# ============================================================
judgment_order:

  - step: 1
    action: 逐维度（D1–D4）标注证据等级、evidence 原文引用与维度级判定。
    note: |
      dimensions 数组必须恰好 4 项，顺序固定为 D1 D2 D3 D4。
      无证据的维度必须标 insufficient_evidence = true，不得凭印象填充。
      E3 必须注明 source（task / interview）。

  - step: 2
    action: 计算声称—实操落差（claim_reality_gap），输出 无 / 轻微 / 重大。
    note: 对比"自述指向的水平"与"T1/T2 实际表现"。

  - step: 3
    action: 检查等级上限（level_caps LC1–LC5）。命中则记录等级上限。

  - step: 4
    action: |
      自 L4 向下逐级检验 required_evidence 是否全部满足，
      取第一个完全满足的等级为候选等级。
    note: |
      必须自高向低、必须"全部满足"。
      禁止用维度平均分或加权求和定级——L3 的三个门槛是合取关系。
      L4 的 inherit: L3 同样是硬性前置。

  - step: 5
    action: 应用等级上限（若第 3 步命中红线，取候选等级与上限中较低者）。

  - step: 6
    action: 若最终等级为 L4，判定轨道；否则轨道输出"无"。

  - step: 7
    action: 若最终等级为 L4，输出 L4_pending（评估A 阶段强制）。

  - step: 8
    action: 输出 confidence、key_uncertainties，并决定 recommend_human_review。


# ============================================================
# 四、等级上限（level_caps）
# ============================================================
# 与 config/prompts/evaluation.md 第六章 LC1–LC5 对齐。
# 注意：本节是「等级上限」（命中即设定 overall.level 上限），
# 与 evaluation.md 第七章「安全红线」（red_lines RL1–RL4，独立于等级）是不同概念。
# evaluation.md 输出的 red_lines 数组对应 RL1–RL4，不对应本节。
level_caps:

  - code: LC1
    name: 声称与实操重大落差
    condition: |
      问卷或考官对话中的自述指向 L3 及以上，
      但 T1 提示词为单要素单句，且 T2 未出现任何核验或质疑动作。
    effect: 等级上限 L2
    reasoning_requirement: |
      必须在 overall.reasoning 中写出具体对照：自述了什么、实操中实际做了什么。

  - code: LC2
    name: 完全无核验意识
    condition: |
      T2 中未对材料提出任何质疑、未要求来源、未表达需要核实的意思，
      且对话中举不出任何一次核验或纠错经历。
    effect: 等级上限 L2
    reasoning_requirement: 需引用 T2 中的具体轮次作为证据。

  - code: LC3
    name: 全程无具体案例
    condition: 全部维度最高证据等级均不超过 E1。
    effect: 等级上限 L1
    note: 若连一次具体使用经历都举不出，按 L0 处理。

  - code: LC4
    name: 明显自相矛盾
    condition: 前后陈述在时间、数字、角色或事实上不自洽，且无法用表达疏漏解释。
    effect: 候选等级下调一级，且强制 recommend_human_review = true。
    reasoning_requirement: 必须并列引用两处矛盾的原文。

  - code: LC5
    name: 实操任务未参与
    condition: T1 与 T2 均无有效输入。
    effect: 等级上限 L1
    note: |
      单个任务未参与不触发本红线，但该任务对应维度记 E0 与
      insufficient_evidence = true，且 L3 的 additional_gate 将因此难以满足。


# ============================================================
# 五、置信度与人工复核
# ============================================================
confidence_rules:
  high:
    range: "0.85 – 1.00"
    condition: 定级依赖的关键维度均有 E3 证据，无红线、无落差。
    note: L4_pending 不可给出 high 置信度，上限 0.80。
  medium:
    range: "0.60 – 0.84"
    condition: 关键维度为 E2，或存在轻微落差，或有 1 个维度证据不足。
  low:
    range: "0.00 – 0.59"
    condition: 两个及以上维度证据不足，或命中红线，或出现矛盾。

recommend_human_review:
  must_be_true_when:
    - level 为 L4_pending
    - 命中任一 level_cap（LC1–LC5）
    - 命中任一安全红线（red_lines RL1–RL4，独立于等级）
    - confidence < 0.60
    - claim_reality_gap 为"重大"
    - 两个及以上维度 insufficient_evidence = true    # 四维度体系下阈值由3改为2


# ============================================================
# 六、给评估模型的强制约束
# ============================================================
constraints_for_evaluator:
  - dimensions 数组必须恰好 4 项，代号与顺序为 D1 D2 D3 D4，不得增删或改名。
  - 每条等级判定必须绑定至少一条 evidence 原文引用。无引用的判定视为无效输出。
  - 禁止使用维度平均分或加权求和定级。required_evidence 为合取条件。
  - 禁止把使用频率高、表达流畅、态度积极、职位高、行业经验长作为升级理由。
  - 禁止把"自称会核验""自称有模板"直接当作 E2。E2 要求可追问的下一层具体细节。
  - 维度无证据时必须标 insufficient_evidence = true，不得推测填充。
  - 评估A 的 level 字段只允许 L0 / L1 / L2 / L3 / L4_pending 五个取值。
  - 轨道字段仅在 L4 时输出实际轨道，其余等级输出"无"。
  - 判定过程中产生的评价性词汇（优秀/薄弱/存疑等）不得进入任何会流向
    追问题纲的字段。题纲只能接收"需要核实的事实点"，不能接收"结论倾向"。
