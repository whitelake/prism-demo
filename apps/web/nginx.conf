# prism-demo 边缘 nginx 配置
# 同时承担：① 静态前端 serve  ② /api 反代到 api 容器  ③ SSE 流式优化
# PoC 简化：单 nginx 容器同时做 web + gateway

server {
    listen 80;
    server_name _;

    # SPA 静态资源根
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（hash 化的资源名可长期缓存）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SSE 流式接口（api-spec 3.6 POST /api/v1/c/:token/message/stream）
    # 必须在 /api/ 通用反代之前匹配，并关闭 buffering
    location ~ ^/api/v1/c/[^/]+/message/stream$ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 关键：关闭 buffering / cache / gzip
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        # SSE 长连接超时（默认 60s 会被 nginx 切断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # 通用 API 反代
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 1m;
    }

    # SPA fallback：所有未匹配路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
