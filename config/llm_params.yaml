# 模型参数配置
#
# 由产品团队维护，运行时热更新。所有模型调用必须经 llm.client.ts（PoC 不变量 4）。
# 变量注入规范见 docs/prompts.md。调用日志字段见 llm_call_log 表（docs/architecture.md 4.x）。

# 全局 baseline：所有 purpose 的默认值，purpose 段可 override
# 注：model 与 api_base 从 env 读取。model 按 purpose 分流：
#   对话(examiner)+任务(tool)：LLM_MODEL_DIALOG（速度优先，enable_thinking=false）
#   评估(eval)+题纲(outline)：LLM_MODEL_EVAL（能力优先，默认开启 thinking）
#   兜底：LLM_MODEL；api_base 用 DASHSCOPE_BASE_URL
baseline:
  timeout_ms: 60000
  max_tokens: 2048            # 输出 token 上限
  max_input_tokens: null     # 输入 token 上限（null 表示不检查）；eval purpose 必须显式设置
  top_p: 0.9
  presence_penalty: 0
  frequency_penalty: 0
  stream: false
  response_format: null

# 重试策略（与 docs/architecture.md 一致）
retry:
  json_parse_fail:
    max_attempts: 2
    temperature_step: -0.1   # 每次重试 temperature 下调 0.1
  schema_validation_fail:
    max_attempts: 3
    temperature_step: -0.1   # 降温重试，给 LLM 机会退出 tool_calls 风格输出
  network_timeout:
    # 单次 LlmClient.call 最长 = timeout_ms × (SDK maxRetries+1=3) × max_attempts
    # eval: 300s × 3 × 1 = 15 分钟；outline: 60s × 3 × 1 = 3 分钟
    # SDK 内部 maxRetries=2 已给 3 次尝试机会，LlmClient 外层不再叠加重试，
    # 避免超长累计（原 max_attempts=3 让 eval 最长 45 分钟）
    max_attempts: 1
    backoff_ms: [1000, 2000, 4000]   # 指数退避（max_attempts=1 时不触发，保留备用）

# 按 purpose override
purposes:
  examiner:
    # 考官模式对话：需要自然的对话变化，但不能跑题
    temperature: 0.6
    stream: true              # 前端 SSE 流式
    max_tokens: 256
    response_format: json_object   # 强制 JSON 输出，避免 markdown 包裹触发 JsonParseError 重试
    enable_thinking: false         # 关闭思维链，单次延迟从 30-70s 降到 2-5s；examiner 只需短问答不需深思

  tool:
    # 工具模式：模拟正常 AI 助手的默认行为
    temperature: 0.7
    stream: true
    max_tokens: 1024
    enable_thinking: false         # 关闭思维链，模拟普通 AI 助手的快速响应
    # 注意：工具模式 Prompt 必须静态（PoC 不变量 1），参数 override 不影响上下文隔离

  eval:
    # 评估（A/B/C）：必须稳定可复现，同一份日志多次评估结果应一致
    temperature: 0.1
    stream: false
    response_format: json_object   # 强制 JSON 输出，经 Schema 校验
    max_tokens: 4096
    # eval 需要深思，保留 thinking 默认（不设 enable_thinking）
    # R3（architecture.md 第10章）：终判输入预估 40K tokens
    # llm.client 调用前估算超限抛 INPUT_TOO_LONG；final-evaluation 按 R3 优先级截断后重试
    max_input_tokens: 40000
    # thinking 模式下 qwen3.7-plus 评估复杂对话单次可能 3-5 分钟，override 到 5 分钟
    # baseline.timeout_ms=60s 不够，会触发 SDK 内部 maxRetries=2 × 60s 浪费 3 分钟再抛错
    timeout_ms: 300000

  outline:
    # 题纲生成：略有灵活度但需稳定
    temperature: 0.3
    stream: false
    response_format: json_object
    max_tokens: 2048
    # outline 需要深思，保留 thinking 默认（不设 enable_thinking）
