# dimensions.yaml
#
# 维度定义。与 levels.yaml 配套注入评估 Prompt。
# levels.yaml 定义"到某一级需要什么"，本文件定义"每个维度怎么判"。
# 由产品团队维护。修改后调用 POST /api/v1/admin/reload-config 生效。
#
# 版本：v0.1（配套 levels.yaml v0.4）
# 说明：原六维度（使用强度/任务拆解/核验意识/流程改造/影响力/组织推动）
#       合并为四维度。原流程改造、影响力、组织推动合并入 D4「沉淀与外溢」。


meta:
  version: "0.1"
  count: 4
  order: [D1, D2, D3, D4]
  output_contract: |
    评估输出的 dimensions 数组必须恰好 4 项，顺序与 order 一致。
    每项结构：
      code: D1 | D2 | D3 | D4
      name: 维度中文名（必须与本文件一致）
      level: L0 | L1 | L2 | L3 | L4      # 维度级判定，不带 _pending
      evidence_grade: E0 | E1 | E2 | E3
      evidence_source: null | task | interview   # 仅 E3 时非空
      evidence: 原文引用数组（至少 1 条，除 insufficient_evidence 为 true 时）
      insufficient_evidence: boolean
      reasoning: 一句话说明为什么判在这一档
  important: |
    维度级 level 仅供面试官理解证据分布，不参与总等级计算。
    总等级只由 levels.yaml 的 required_evidence 合取判定。
    禁止用四个维度 level 求平均或加权得出总等级。


dimensions:

  # ==========================================================
  - code: D1
    name: 使用强度与场景广度
    measures: |
      真实使用的频率、覆盖的任务类型宽度、是否已进入核心工作
      而非边缘性尝试。
    why_it_matters: |
      这是能否进入评估的门槛维度，决定 L0 / L1 的分界。
      它同时也是其他三个维度证据存在的前提——没有真实使用量，
      不可能产生拆解、核验与沉淀的行为。
    evidence_sources:
      primary: 问卷自报 + 考官模式对话
      secondary: T1/T2 中的实际投入程度（轮次、信息量）
    max_grade_in_evaluation_a: E3
    ladder:
      L0: 举不出任何一次可定位的具体使用场景。
      L1: |
        能说出至少一次具体经历（有时间、有具体任务），
        但使用集中在单一低风险任务上（查资料、写短文本、翻译等）。
      L2: |
        覆盖两类及以上任务，已成为日常工作的一部分而非偶发尝试，
        能说出不同任务下的不同用法。
      L3: |
        已成为核心工作流的常规环节，能清楚说出哪类任务固定会用、
        哪类任务不用，且理由具体。
      L4: 同 L3。本维度不再向上区分。
    judgment_notes:
      - 频率高不等于等级高。每天用十次但都是单句问答，本维度最多 L2，总等级仍是 L1。
      - 本维度不可单独支撑 L2 及以上的总等级。D1 判到 L3 而 D2/D3 停在 L1 时，
        总等级仍由 D2/D3 决定。
      - 问卷自报与对话自述不一致时，以对话中能给出具体细节的一方为准，
        并在 key_uncertainties 中记录不一致。
    common_misjudgment: |
      × 把"接触过很多 AI 工具"当作场景广度。工具数量不是判据，
        任务类型的宽度才是。用五个工具做同一件事仍是单一场景。

  # ==========================================================
  - code: D2
    name: 任务拆解与信息组织
    measures: |
      面对一个不那么简单的任务时，如何组织信息交给 AI：
      提示词的要素完整度、迭代方式、以及是否有"哪部分不交给 AI"的边界意识。
    why_it_matters: |
      这是 L1 → L2 的主要分界维度，也是 L2 → L3 的第一个门槛。
      它由 T1 直接印证，是本测评证据最硬的维度之一。
    evidence_sources:
      primary: T1（生成类任务）的完整对话过程 —— 可达 E3
      secondary: 考官模式对话中对工作方法的描述
    max_grade_in_evaluation_a: E3
    prompt_elements:
      description: 判定"要素完整度"时使用的清单。命中几类即为几个要素。
      items:
        - 背景：任务发生的情境、前因
        - 对象：面向谁、对方身份或立场
        - 约束：不能怎样、必须保留什么、风险点
        - 诉求：希望达成的具体结果
        - 格式：结构、长度、语气、输出形态
        - 示例：给出参照样本或反例
    iteration_rules:
      有效迭代: |
        第二轮及之后补充了新信息（新的约束、新的背景、更明确的诉求），
        或改变了任务的组织方式（先要框架再要内容）。
      无效迭代: |
        只是换措辞重复同一诉求——"再写一遍""写好一点""不太满意，重新来"。
        无效迭代不论出现多少次，均不提升本维度等级。
    ladder:
      L0: T1 无有效输入（未提交，或输入与任务无关）。
      L1: |
        单句单要素指令；若有多轮，均为无效迭代。
      L2: |
        提示词包含两类及以上要素，或出现至少一次有效迭代。
      L3: |
        出现结构化拆解——分步骤、分角色、分阶段（如先要框架、确认后再填充内容）；
        或能明确说出"哪一部分我不交给 AI，因为……"且理由具体。
      L4: 同 L3。本维度不再向上区分。
    judgment_notes:
      - 提示词长度不是判据。三百字的啰嗦叙述可能只有一个要素；
        四十字的指令可能包含四类要素。
      - '"不交给 AI 的边界意识"必须带具体理由（如"这段涉及客户报价，
        措辞出问题追责成本高"）。只说"有些事不能靠 AI"是 E1。'
      - 本维度是 L3 additional_gate 的两个候选之一。若 T1 表现达到 L3 档
        且与自述一致，标记 evidence_grade = E3, source = task。
    common_misjudgment: |
      × 因为候选人在考官对话中把方法讲得很清楚就判 L3，而 T1 实际只写了一句话。
        这属于声称—实操落差，应触发 red_lines.claim_reality_gap。

  # ==========================================================
  - code: D3
    name: 核验意识
    measures: |
      是否把 AI 输出当作待验证的草稿：有无可执行的核验动作、
      有无真实的纠错经历、能否说出不该用 AI 的场景及其风险理由。
    why_it_matters: |
      这是 L2 → L3 的第二个门槛，也是本测评中风险信号最强的维度。
      一个提示词写得漂亮但从不核对数字的人，实际风险高于一个提示词朴素
      但每次都查来源的人。由 T2 直接印证。
    evidence_sources:
      primary: T2（核查类任务）的完整对话过程 —— 可达 E3
      secondary: 考官模式对话中的纠错案例
    max_grade_in_evaluation_a: E3
    verification_actions:
      description: |
        判定"可执行的核验动作"时的参考清单。必须是具体动作，不是态度表述。
      items:
        - 查原始来源（回到原表、原报告、原始数据）
        - 交叉比对（用另一个渠道或另一次提问验证同一事实）
        - 自己复算（对数字自行计算一遍）
        - 追问依据（要求 AI 说明结论的来源或统计口径）
        - 识别缺失（指出材料缺少来源、时间、口径等关键信息）
    ladder:
      L0: |
        T2 中无任何核验痕迹，且对话中举不出任何一次核验或纠错经历。
      L1: |
        拿来即用。明确表示"没注意过它会说错"或"应该不会错"。
      L2: |
        直觉验收——判断标准是"读起来通不通顺、像不像对的"，
        不做外部交叉核对，对数字与引用来源缺少警觉。
      L3: |
        有可执行的核验动作（命中 verification_actions 至少一项），
        且能举出至少一次发现 AI 出错并纠正的具体案例（有具体错在哪）。
      L4: |
        在 L3 基础上，能明确说出 AI 使用禁区及基于具体失败风险的理由。
        注意：这不是 L4 总等级的门槛，仅为本维度的最高档，
        属于加分证据，不得据此单独判总等级为 L4。
    judgment_notes:
      - '"我会检查""我一定会核对"是态度表述，不是核验动作，判 E1。
        要有"我会去核对原表里的数字"这类可执行描述才是 E2。'
      - 纠错案例必须具体到错在哪（把去年数据说成今年、把两个人名混了），
        只说"它经常出错，我会改"是 E1。
      - 本维度是 L3 additional_gate 的两个候选之一。T2 中出现实际核验行为
        且与自述一致时，标记 evidence_grade = E3, source = task。
    common_misjudgment: |
      × 候选人在 T2 中让 AI 自己判断材料真伪，就当作核验行为。
        向 AI 求证 AI 的输出不构成独立核验，本维度仍判 L2。

  # ==========================================================
  - code: D4
    name: 沉淀与外溢
    measures: |
      有效用法是否被固化成可重复使用的形态；这种形态是否已扩散到
      他人、协作流程或组织机制。
    why_it_matters: |
      本维度同时承载两条分界线：
      · L3 档 = L2 → L3 的第三个门槛（个人沉淀）；
      · L4 档 = L3 → L4 的唯一门槛（外溢）。
      注意本维度无任何对应实操任务，最高只能达到 E2，
      这是 L4 恒为 L4_pending 的直接原因。
    evidence_sources:
      primary: 考官模式对话（唯一来源）
      secondary: 无
    max_grade_in_evaluation_a: E2
    ladder:
      L0: 无任何沉淀相关表述。
      L1: 明确表示没有沉淀，每次从零重新组织。
      L2: |
        声称"有自己的一套方法"但说不出形态（是模板？提示词？清单？流程？），
        或说不出任何一次迭代内容。
      L3: |
        个人层面存在稳定复用物，且能说出：
        ① 形态（固定提示词 / 模板 / 检查清单 / 固定工作流）；
        ② 至少一次迭代内容（第二版加了什么、为什么加）。
      L4: |
        L3 成立，且外溢事实成立——以下三种形式任一，含可核查细节：
        （a）他人采纳：能说出采纳者身份（角色/人数）、采纳的具体对象、
             使用场景、大致持续时间；
        （b）跨人流程改造：能说出改造的是哪个环节、原来怎么做、现在怎么做、
             涉及几个人、是否已成为常态；
        （c）组织机制：能说出机制内容、覆盖范围（几人/几个团队）、运行时长，
             且该机制脱离本人指导仍可运行。
    spillover_disqualifiers:
      description: 以下情形不构成外溢事实，本维度不得判 L4。
      items:
        - '"分享过 / 讲过 / 教过"但无法说明对方是否持续在用。'
        - '"我要求团队都用 AI"——这是职权要求，不是方法被采纳。'
        - 公司或上级统一推行的做法，非本人推动形成。
        - 只有制度文档或方案，说不出实际覆盖范围与运行时长。
        - 描述停留在"效率提升很多""大家都觉得好用"这类不可追问的表达。
    ladder_gate:
      description: |
        L4 档必须以 L3 档成立为前提。
        若外溢事实成立但个人层面无沉淀（说不出自己的复用物），
        本维度判 L2，并在 reasoning 中写明"有推动动作但个人沉淀缺失"。
      rationale: |
        这种组合最常出现在管理者身上：能调动他人采用某种做法，
        但自己的实际应用深度不足，无法判断产出质量、也无法在方法失效时纠偏。
        这是真实招聘中的高风险误判，必须显式拦截。
    judgment_notes:
      - 本维度在评估A 阶段最高 E2。不得输出 E3。
      - 本维度判到 L4 时，总等级输出 L4_pending，并必须填写
        key_uncertainties 说明需现场核实哪些事实点。
      - 本维度证据不足（insufficient_evidence = true）时，总等级最高 L2，
        因为 L3 的第三个门槛无法满足。
    common_misjudgment: |
      × 把"用得很深很专业"当作外溢。深度属于 D2/D3，本维度只看是否固化与扩散。
      × 把职位高、能调动资源当作外溢证据。判据是他人行为是否真的改变了。
