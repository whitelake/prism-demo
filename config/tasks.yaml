# 每个 task 下的 variants 为平行题面,按 assessmentId 确定性选取。
# gaps / defects 为内部字段,仅供 A 评估使用,严禁下发到前端。
tasks:
  - id: T1
    duration_minutes: 20
    require_min_turns: 0
    variants:
      - id: T1-A
        title: 交付延迟回复
        description: |
          下班前回复王总这件事。

          【微信 · 华东经销商群】
          王总 09:12  上次说的那批货什么时候能到?
          王总 11:40  我这边客户一直在问,你给个准话
          王总 14:03  再拖下去我这边不好交代了

          【内部邮件 · 生产部 → 销售部(抄送你)】
          主题:物料到货情况
          上游那批物料预计下周中到,具体日期还没定,到了之后排产大概 2 天。

          【排产表截图文字】
          华东-王总订单｜计划出库 3/18｜备注:待物料
          华东-王总订单｜计划出库 3/22｜备注:调整后

          【公司通知】
          本周五下午行政楼停电,请提前保存文件。
        gaps:
          - 3/18 与 3/22 需自行选定其一,或改为区间表述
          - 上游物料短缺属内部信息,是否对客户披露需自行判断
          - 语气需自行定(王总已三次催问,语气渐重)
          - 停电通知为无关项,应被排除

      - id: T1-B
        title: 会议结果同步
        description: |
          把今天的会议结果同步给项目组。

          【你的会议速记】
          - 方案二通过,方案一不做了
          - 小李负责接口,下周
          - 数据那块……周三之前?(没记清)
          - 老板说对外先别说
          - 测试环境的事下次再议

          【会后微信 · 小李】
          接口我最快下周三给你,周一肯定不行。

          【会后微信 · 小张】
          刚才会上说的数据整理是我做还是运营做?没听清。

          【旧版排期表】
          接口联调 3/10｜数据整理 3/12｜内部演示 3/15
          (注:此表为上周版本)

          【系统通知】
          OA 系统将于本周六 0:00-6:00 停机维护。
        gaps:
          - 数据整理负责人未定,需自行指派或明确标注待定
          - 小李口头承诺(下周三)与旧排期表(3/12)冲突
          - '"对外先别说"需体现为同步范围的约束'
          - 测试环境为悬置事项,是否写入需判断
          - OA 停机通知为无关项,应被排除

      - id: T1-C
        title: 客户投诉回复
        description: |
          给这位客户回一封回复。

          【客服转来的原始投诉】
          买了三个月就坏了,你们这质量也太差了。我要退货退款,还要赔偿我
          误工费。而且上次打客服电话等了二十多分钟没人接,这服务态度我
          也要投诉。另外我朋友买的同款有问题,你们是不是批次有问题?

          【订单记录】
          下单 11/28｜签收 12/02｜保修期 12 个月｜无维修记录

          【客服内部备注】
          该客户 9 月曾就另一订单投诉并获全额退款,注意甄别。

          【退款政策摘录】
          非人为损坏可申请换新或维修;符合条件者可办理退款,
          具体以核定结果为准。
        gaps:
          - 四项诉求(退款/误工费/服务投诉/批次问题)需分别处理,不能笼统答应
          - 内部备注绝不可外露
          - 政策表述模糊,可退款的条件边界需自行把握
          - 仍在保修期内这一事实需被用上

  - id: T2
    duration_minutes: 20
    require_min_turns: 0
    variants:
      - id: T2-A
        title: 销量简报
        description: |
          把下面的材料整理成一页简报,发给部门负责人。

          【一季度区域销量】
          华东 120 万｜华南 95 万｜华北 80 万｜合计 320 万

          【同比】
          去年同期合计 275 万,本季同比增长 15%。

          【市场情况】
          我司市占率 12%,位居行业前列。
          据行业内部消息,明年整体市场规模将增长 20%。

          【备注】
          市占率数据来源:2021 年行业年鉴。
        defects:
          - level: 低
            desc: 120+95+80=295,与"合计 320 万"不符
          - level: 中
            desc: 275→295 约为 7.3%,与"同比增长 15%"不符
          - level: 高
            desc: '"据行业内部消息"无可核出处'
          - level: 高
            desc: 市占率引自 2021 年行业年鉴,用于说明当前情况已过时

      - id: T2-B
        title: 岗位说明
        description: |
          根据下面的材料,写一份对外发布的岗位说明。

          【团队介绍草稿】
          我们是一支 15 人的产品技术团队,成立于 2023 年,
          目前团队规模 20 余人,服务超过 500 家企业客户。

          【产品情况】
          核心产品于 2022 年正式上线,目前已迭代至 4.0 版本。
          公司在细分领域市场份额排名第一。

          【招聘需求】
          岗位:产品经理
          要求:3 年以上经验,有 B 端产品经验优先
          地点:上海
        defects:
          - level: 低
            desc: 团队规模同段内自相矛盾(15 人 / 20 余人)
          - level: 中
            desc: 2023 年成立但产品 2022 年上线,时间线倒挂
          - level: 高
            desc: '"市场份额排名第一"无出处、无统计口径'

      - id: T2-C
        title: 项目复盘要点
        description: |
          把下面的材料整理成一份项目复盘要点,发给项目组。

          【项目基本情况】
          项目启动 3 月 1 日,正式上线 5 月 20 日。
          验收会议记录日期:5 月 12 日。

          【投入统计】
          开发 320 人时｜测试 140 人时｜设计 90 人时｜合计 500 人时

          【效果】
          上线后用户满意度 98%。
          (满意度来源:上线当周对 3 位试用用户的电话访谈)

          【遗留】
          性能优化未完成,排期待定。
        defects:
          - level: 低
            desc: 320+140+90=550,与"合计 500 人时"不符
          - level: 中
            desc: 验收会议(5/12)早于上线日期(5/20),时间线倒挂
          - level: 高
            desc: 98% 满意度由 3 人样本得出,不足以支撑该表述
